name: Build on push
on:
  push:
    branches:
      - dev

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["amd64", "arm64"]
        os: ["linux", "windows"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true
      - name: Install dependencies
        run: go get -x
      - name: Compile
        run: go build -x -o out/
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        if: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        with:
          name: conduwuit-room-policy-subscriber-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          compression-level: 2
          if-no-files-found: error
