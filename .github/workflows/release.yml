name: Upload binaries to release
on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ "amd64", "arm64" ]
        os: [ "linux", "windows" ]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true
      - name: Install dependencies
        run: go get -x
      - name: Compile
        run: go build -x -o out/
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os }}
      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: conduwuit-room-policy-subscriber-*
          token: ${{ secrets.GITHUB_TOKEN }}
